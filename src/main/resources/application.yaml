spring:
  application:
    name: dirtyhands
  config:
    import: file:.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/dirtyhands;AUTO_SERVER=TRUE
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate # or validate/create-drop as you prefer
    show-sql: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
